# ============================================================================
# DKD 管理前端站点 + /prod-api 反向代理（挂载到 nginx:1.27-alpine）
#
# 为什么反代要这么写（三个都是实测踩过的点）：
#   ① `/prod-api/` → `http://dkd-admin:8080/`：前缀必须**去掉**（RuoYi 后端没有 /prod-api
#      这一层），末尾的 `/` 不能省，否则路径会拼成 /prod-api/login 打到后端 404。
#   ② **SSE 必须关缓冲**：智能体对话是逐帧推送（0-6/0-8 已验证 Java 网关逐块 flush），
#      只要 nginx 开了 proxy_buffering，前端会“一次性”收到整段内容 —— 逐 token 打字机效果消失。
#      同时关掉 proxy_cache 并下发 `X-Accel-Buffering: no`（双保险）。
#   ③ **读超时要放大**：默认 60s 会把长对话掐断；这里给 1 小时（网关侧 Tomcat 同步写不受
#      asyncTimeout 限制，见排期 §七 之 5）。
# ============================================================================
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;          # 头像/Excel 导入等；再大的文件走 OSS（x-file-storage）

    # 构建产物里带 .gz（VITE_BUILD_COMPRESS=gzip），直接发预压缩文件，省 CPU
    gzip_static on;
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 基础安全头（RuoYi 内部有 iframe 视图，故用 SAMEORIGIN 而不是 DENY）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 前端 history 路由：不管什么路径都回 index.html，由 Vue Router 自己分发
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite 产物带 hash，可安全长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API + 智能体网关（/prod-api/agent/** → Java 网关 → Python）
    location /prod-api/ {
        proxy_pass http://dkd-admin:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # —— SSE 相关（见文件头 ② ③）——
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 说明：Druid 监控台（/druid/**）与 Knife4j 文档**故意不反代**——
    # 它们只通过 SSH 隧道访问 127.0.0.1:${DKD_ADMIN_PUBLISH_PORT} 的 8080 查看。
}
