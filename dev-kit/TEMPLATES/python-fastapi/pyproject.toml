[project]
name = "__APP_NAME__"
version = "0.1.0"
description = "__APP_NAME__ service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# devkit 以 vendored 方式放在项目根（由 init-project 脚本复制），
# 因此不在此处声明外部依赖 —— 保证项目自包含、可独立复制运行。
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "T20", "ANN", "PTH"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# 默认排除 live（真实外部调用），显式 -m live 才跑
addopts = "-q --strict-markers -m 'not live'"
markers = ["live: 真实调用外部服务，需显式 -m live"]

[tool.coverage.run]
source = ["app"]
