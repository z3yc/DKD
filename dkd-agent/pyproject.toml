[project]
name = "dkd-agent"
version = "0.1.0"
description = "DKD 智能体服务（旁路集成：读走 MySQL 只读账号，写走 Java REST 回调）"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "aiosqlite>=0.20",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

# 会话持久化不使用 Redis：本机 Redis 为 3.2.100，无模块系统（无 RedisJSON/RediSearch）、
# 内核 < 5.0（无 Streams），langgraph-checkpoint-redis 不可用 —— 见方案 V1.1 §5.1。
# 若未来多实例部署需迁移，再引入 redis / langgraph-checkpoint-redis。

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "T20", "ANN", "PTH"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
# 严格模式：本项目自身的 DeprecationWarning 视为失败；第三方（anyio/starlette）的已知弃用项豁免
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:anyio.*",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]

[tool.coverage.report]
fail_under = 70
